<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="清风伴节气 廉韵润心田 - 探寻二十四节气里的中央八项规定智慧" />
  <meta name="keywords" content="二十四节气,中央八项规定,廉政教育,H5动画,中国传统文化" />
  <meta name="author" content="中国热科院纪检组" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="清风伴节气 廉韵润心田" />
  <meta property="og:description" content="探寻二十四节气里的中央八项规定智慧" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="清风伴节气 廉韵润心田" />
  <meta property="twitter:description" content="探寻二十四节气里的中央八项规定智慧" />
  
  <!-- 移动端优化 -->
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="清风伴节气" />
  
  <!-- 图标 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <title>清风伴节气 廉韵润心田</title>
  
  <style>
    /* 加载动画 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFDF1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #f5dbc3;
      border-top: 4px solid #fa9a41;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    .loading-text {
      color: #f17703;
      font-size: 18px;
      font-family: 'Microsoft YaHei', sans-serif;
      text-align: center;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 加载动画 -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">
      <div>清风伴节气 廉韵润心田</div>
      <div style="font-size: 14px; margin-top: 10px; opacity: 0.8;">正在加载中...</div>
    </div>
  </div>
  
  <div id="app"></div>
  
  <script type="module" src="/src/main.js"></script>
  
  <script>
    // 页面加载完成后隐藏加载动画
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('fade-out');
          setTimeout(function() {
            loading.style.display = 'none';
          }, 500);
        }
      }, 1000);
    });
    
    // 错误处理
    window.addEventListener('error', function(e) {
      console.error('页面错误:', e.error);
    });
    
    // 阻止默认的触摸行为（如双击缩放）
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    });
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>
</body>
</html>
